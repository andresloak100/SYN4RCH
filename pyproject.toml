[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "syn4rch"
version = "0.2.0"
description = "Curated hypothalamic neuronal perturbation -> systemic physiology dataset, with its schema and QC core"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

# No runtime dependencies, deliberately. The schema and QC layers use the
# Python standard library only so they run on any 3.10+ interpreter with no
# install step and no network. See docs/DECISIONS.md (D-001).
dependencies = []

[project.optional-dependencies]
# Strictly optional layers. The invariant from DECISIONS.md D-001 still holds
# and is not negotiable: nothing in src/syn4rch/schema, src/syn4rch/qc,
# src/syn4rch/vocab, src/syn4rch/harvest, src/syn4rch/curate or
# src/syn4rch/feasibility may import any of these. Only src/syn4rch/models
# may, and it must guard every such import so that `import syn4rch.models`
# still succeeds when they are absent.
models = ["numpy>=1.23", "scikit-learn>=1.1"]
dev = ["pytest>=7"]

[project.scripts]
syn4rch-qc = "syn4rch.qc.run:main"
syn4rch-harvest = "syn4rch.harvest.run:main"
syn4rch-curate = "syn4rch.curate.run:main"
syn4rch-pilot = "syn4rch.curate.pilot:main"
syn4rch-migrate = "syn4rch.curate.migrate:main"
syn4rch-yield = "syn4rch.curate.yield_report:main"
syn4rch-feasibility = "syn4rch.feasibility.run:main"
syn4rch-identity = "syn4rch.feasibility.identity_run:main"
syn4rch-models = "syn4rch.models.run:main"
syn4rch-signaling = "syn4rch.atlas.signaling:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
